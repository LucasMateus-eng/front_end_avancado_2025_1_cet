<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exemplo 01 - Formulários HTML</title>
</head>

<body>
  <form>
    <label for="iptName">Seu nome:</label>
    <input type="text" name="iptName" id="iptName" placeholder="Seu nome">
    <hr>

    <label for="iptMessage">Fale conosco:</label>
    <textarea name="iptMessage" id="iptMessage" rows="4" cols="50">Nós nos importamos com a sua opnião...</textarea>
    <hr>

    <!-- <input type="submit" value="Enviar"> -->
    <button type="submit">Enviar</button>
  </form>
</body>

</html>
