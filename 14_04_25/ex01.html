<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <form>
    <label for="fname">Seu nome:</label>
    <input type="text" name="fname" id="fname" placeholder="Nome completo">
    <br>

    <label for="fdate">Data de nascimento:</label>
    <input type="date" name="fdate" id="fdate">
    <br>

    <label for="femail">E-mail:</label>
    <input type="email" name="femail" id="femail" placeholder="Seu melhor e-mail">
    <br>

    <label for="fpassword">Sua senha:</label>
    <input type="password" name="fpassword" id="fpassword">
    <br>

    <label for="fdatetime">Horário de saída:</label>
    <input type="datetime-local" name="fdatetime" id="fdatetime">
    <br>

    <label for="fcheckbox">Seu checkbox:</label>
    <input type="checkbox" name="fcheckbox" id="fcheckbox">
    <br>

    <label for="fhtml">HTML</label>
    <input type="radio" id="fhtml" name="fav_lang" value="HTML">

    <label for="fcss">CSS</label>
    <input type="radio" id="fcss" name="fav_lang" value="CSS">
    <br>

    <input type="submit" value="Enviar">
  </form>
</body>

</html>
