<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ex02 - Tabelas</title>

  <style>
    table {
      border-collapse: collapse;
    }

    th,
    td {
      border: 1px solid black;
      border-color: blueviolet;
    }
  </style>
</head>

<body>
  <table>
    <tr>
      <th>Empresa</th>
      <th>Contato</th>
      <th>País</th>
    </tr>

    <tr>
      <td>Tudo é festa</td>
      <td>Seu José</td>
      <td>Brasil</td>
    </tr>

    <tr>
      <td>Target</td>
      <td>John Doe</td>
      <td>EUA</td>
    </tr>
  </table>
</body>

</html>
